# =========================
# DB接続（Docker対応）
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/ryodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ryo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ryopass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# HikariCP
# =========================
spring.datasource.hikari.maximum-pool-size=10

# =========================
# MyBatis設定
# =========================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ryoProject.dto

# =========================
# MyBatis + SQLログ
# =========================
logging.level.com.ryoProject=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.apache.ibatis=DEBUG