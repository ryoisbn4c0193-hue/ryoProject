spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/ryodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ryo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ryopass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use a reasonable pool size for development
spring.datasource.hikari.maximum-pool-size=10
